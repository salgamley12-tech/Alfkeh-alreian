name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Pin Kotlin to Compose-compatible version
        shell: bash
        run: |
          if grep -RIl --exclude-dir=.gradle --exclude-dir=build '1\.9\.24' android; then
            grep -RIl --exclude-dir=.gradle --exclude-dir=build '1\.9\.24' android | xargs -r sed -i 's/1\.9\.24/1.9.25/g'
          fi
          echo 'Kotlin version references after pin:'
          grep -RIn --exclude-dir=.gradle --exclude-dir=build 'kotlinVersion\|kotlin.*1\.9\.' android || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debt-sales-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Force Kotlin 1.9.25 in gradle.properties
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle_props = Path('android/gradle.properties')
          if gradle_props.exists():
              content = gradle_props.read_text()
              lines = [l for l in content.splitlines() if not l.strip().startswith('android.kotlinVersion=')]
              lines.append('android.kotlinVersion=1.9.25')
              gradle_props.write_text('\n'.join(lines) + '\n')
              print("Successfully updated android.kotlinVersion to 1.9.25")
          else:
              print("Error: gradle.properties not found!")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debt-sales-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          

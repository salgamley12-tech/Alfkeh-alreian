name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Pin Kotlin Gradle plugin to 1.9.25
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path('android')
          properties = android / 'gradle.properties'
          text = properties.read_text() if properties.exists() else ''
          text = re.sub(r'(?m)^android\.kotlinVersion=.*\n?', '', text)
          text = text.rstrip() + '\n\nandroid.kotlinVersion=1.9.25\n'
          properties.write_text(text)

          # Also update any generated Gradle file that hard-codes the old version.
          for path in android.rglob('*'):
              if path.is_file() and path.suffix in {'.gradle', '.kts', '.properties'}:
                  try:
                      contents = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if '1.9.24' in contents:
                      path.write_text(contents.replace('1.9.24', '1.9.25'))

          print('Pinned android.kotlinVersion=1.9.25')
          print('\n'.join(line for line in properties.read_text().splitlines() if 'kotlinVersion' in line))
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debt-sales-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
